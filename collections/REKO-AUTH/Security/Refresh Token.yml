info:
  name: Refresh Token
  type: http
  seq: 1

http:
  method: POST
  url: "{{REKO_AI_AUTH_URL}}/api/v1/auth/token/refresh"
  body:
    type: json
    data: |-
      {
        "refresh": "{{REFRESH_TOKEN}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        if (data && data.access) {
          bru.setVar("ACCESS_TOKEN", data.access);
          bru.setVar("REFRESH_TOKEN", data.refresh);
          console.log("Refreshed Tokens and was saved successfully!");
        }
        else {
          console.log("Access key not found in response");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
