info:
  name: Revoke Token FOR LOGGING OUT
  type: http
  seq: 8

http:
  method: POST
  url: "{{REKO_AI_AUTH_URL}}/api/v1/auth/token/revoke"
  body:
    type: json
    data: |-
      {
        "access": "{{ACCESS_TOKEN}}"
      }
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
