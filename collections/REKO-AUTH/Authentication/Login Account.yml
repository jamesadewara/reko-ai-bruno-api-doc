info:
  name: Login Account
  type: http
  seq: 2

http:
  method: POST
  url: "{{REKO_AI_AUTH_URL}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "jamesadewara3@gmail.com",
        "password": "SecurePassword123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        if (data && data.access) {
          bru.setVar("ACCESS_TOKEN", data.access);
          bru.setVar("REFRESH_TOKEN", data.refresh);
          console.log("Tokens saved successfully!");
        }
        else {
          console.log("Access key not found in response");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
