info:
  name: Update Profile
  type: http
  seq: 5

http:
  method: PUT
  url: "{{REKO_AI_AUTH_URL}}/api/v1/auth/profile"
  body:
    type: json
    data: |-
      {
        "name": "James Ayomide Adewara",
        "date_of_birth": "1995-05-10"
