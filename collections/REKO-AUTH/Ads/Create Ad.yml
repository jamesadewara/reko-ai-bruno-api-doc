info:
  name: Create Ad
  type: http
  seq: 1

http:
  method: POST
  url: "{{REKO_AI_AUTH_URL}}/api/v1/ads/"
  body:
    type: json
    data: |-
      {
        "headline": "Test Ad Headline",
        "website_url": "https://propellerads.com/",
        "content": "This is a test ad content description.",
        "image_url": "https://www.shutterstock.com/image-photo/attractive-happy-young-businesswoman-using-260nw-2480305527.jpg",
        "categories": ["technology", "saas"]
      }
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
