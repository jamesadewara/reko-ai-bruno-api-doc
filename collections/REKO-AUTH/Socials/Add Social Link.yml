info:
  name: Add Social Link
  type: http
  seq: 2

http:
  method: POST
  url: "{{REKO_AI_AUTH_URL}}/api/v1/socials/"
  body:
    type: json
    data: |-
      {
        "name": "facebook",
        "url": "https://facebook.com/testuser"
      }
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
