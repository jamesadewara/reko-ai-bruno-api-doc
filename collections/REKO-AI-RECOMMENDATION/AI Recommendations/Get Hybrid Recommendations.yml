info:
  name: Get Hybrid Recommendations
  type: http
  seq: 2

http:
  method: POST
  url: "{{REKO_AI_SYSTEM_URL}}/api/v1/recommendations/hybrid"
  body:
    type: json
    data: |-
      {
        "k_similar_users": 5,
        "category": "movies"
      }
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
