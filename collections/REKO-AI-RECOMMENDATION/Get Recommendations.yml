info:
  name: Get Recommendations
  type: http
  seq: 3

http:
  method: POST
  url: "{{REKO_AI_SYSTEM_URL}}/api/v1/recommend/"
  body:
    type: json
    data: |-
      {
        "context": {
          "time_of_day": "evening",
          "location": "Lagos",
          "device": "mobile",
          "recent_activity": ["watched action movie trailer"]
        },
        "limit": 5
      }
  auth: bearer

auth:
  bearer:
    token: "{{ACCESS_TOKEN}}"
