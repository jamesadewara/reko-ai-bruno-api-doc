info:
  name: Generate Review
  type: http
  seq: 1

http:
  method: POST
  url: "{{REKO_AI_SYSTEM_URL}}/api/v1/reviews/generate"
  body:
    type: json
    data: |-
      {
        "product": {
          "name": "Nollywood Classics",
          "category": "movies",
          "description": "A collection of classic Nigerian movies from the 90s.",
          "image_url": "https://images.example.com/nollywood.jpg"
        }
      }
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
